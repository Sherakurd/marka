<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zhiar Watch - فرۆشگای ئۆنلاین بۆ کاتژمێری مارکە</title>
    <!-- FontAwesome Icons for clean professional icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Rudaw';
            src: url('Rudaw.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg: #0a0a0a;
            --card-bg: #141414;
            --card-hover: #1c1c1c;
            --accent: #ffffff;
            --text-main: #ffffff;
            --text-muted: #999999;
            --border: #222222;
            --danger: #ff4757;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rudaw', 'Vazirmatn', sans-serif; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; direction: rtl; padding-bottom: 50px; }

        /* Hide Netlify/Vercel Badge */
        a[href*="netlify"], a[href*="vercel"], .netlify-badge { display: none !important; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

        header {
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px);
            padding: 10px 0; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }

        .header-content { display: flex; flex-direction: column; gap: 10px; width: 100%; }

        .header-main-row {
            display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%;
        }

        .menu-btn {
            background: transparent; border: none; color: var(--text-main);
            width: 40px; height: 40px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 5px; cursor: pointer; flex-shrink: 0;
        }
        .menu-btn span { display: block; width: 22px; height: 2px; background: var(--text-main); border-radius: 2px; }

        /* لۆگۆ و دەق لە یەک ڕیزدا */
        .brand-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon-box {
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 50%;
        }
        .logo-icon-box img { width: 100%; height: 100%; object-fit: contain; }
        .brand-title {
            font-size: 1.1rem; font-weight: bold; color: #fff; letter-spacing: 0.5px;
        }

        .header-search-wrapper { flex-grow: 1; max-width: 500px; position: relative; display: flex; align-items: center; }
        .header-search-input {
            width: 100%; background: #121818; border: 1px solid #223030; border-radius: 12px;
            padding: 10px 14px 10px 38px; color: var(--text-main); font-size: 0.85rem; outline: none; transition: 0.2s;
        }
        .header-search-input:focus { border-color: #3b5252; background: #162020; }
        .header-search-icon {
            position: absolute; right: 12px; color: var(--text-muted); font-size: 0.9rem; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
        }

        .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .icon-btn {
            background: transparent; border: none; color: var(--text-main);
            width: 40px; height: 40px; border-radius: 10px; display: flex;
            align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem;
            position: relative; transition: 0.2s;
        }
        .icon-btn:hover { background: var(--card-hover); }
        
        .badge-count {
            position: absolute; top: 4px; left: 4px; background: var(--danger); color: #fff;
            font-size: 0.6rem; font-weight: bold; width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        .sidebar {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
            background: #111; border-left: 1px solid var(--border);
            z-index: 1000; transition: 0.3s ease; padding: 20px;
            display: flex; flex-direction: column; gap: 8px; overflow-y: auto; box-shadow: -15px 0 40px rgba(0,0,0,0.8);
        }
        .sidebar.active { right: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .sidebar-title { font-size: 0.95rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .close-sidebar { background: transparent; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; }

        .sidebar-item {
            background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border);
            padding: 10px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; text-align: right; 
            transition: 0.2s; font-size: 0.85rem; width: 100%; display: flex; align-items: center; gap: 10px; text-decoration: none;
        }
        .sidebar-item i { width: 18px; text-align: center; }
        .sidebar-item.active, .sidebar-item:hover { background: #fff; color: #000; border-color: #fff; }

        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); z-index: 999;
        }
        .overlay.active { display: block; }

        .controls { display: flex; justify-content: flex-end; margin: 20px 0; }
        .filter-box {
            padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px;
            background: var(--card-bg); color: var(--text-main); outline: none; font-size: 0.85rem; width: 100%; max-width: 220px;
        }

        .products-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
        }
        @media(min-width: 768px) { .products-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
        @media(min-width: 1024px) { .products-grid { grid-template-columns: repeat(4, 1fr); } }

        .product-card {
            background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border);
            overflow: hidden; display: flex; flex-direction: column; transition: 0.2s ease; cursor: pointer; position: relative;
        }
        .product-card:hover { border-color: #333; background: var(--card-hover); }
        
        .badge {
            position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.7);
            color: #fff; font-size: 0.6rem; font-weight: 600; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border); z-index: 5;
        }

        .wishlist-btn {
            position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.7);
            color: #fff; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer; z-index: 6; transition: 0.2s;
        }
        .wishlist-btn.liked { color: var(--danger); border-color: rgba(255, 71, 87, 0.4); }

        .product-img { width: 100%; height: 160px; background: #000; position: relative; overflow: hidden; }
        @media(min-width: 768px) { .product-img { height: 210px; } }
        .product-img img { width: 100%; height: 100%; object-fit: cover; }

        .product-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
        .product-name { font-size: 0.9rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-price { font-size: 0.85rem; font-weight: bold; color: #fff; }
        .product-meta { font-size: 0.7rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }

        .btn-add {
            background: #fff; color: #000; border: none; padding: 8px; border-radius: 8px; 
            font-weight: bold; cursor: pointer; width: 100%; text-align: center; 
            margin-top: auto; font-size: 0.78rem; transition: 0.2s;
        }
        .btn-add:hover { background: #e0e0e0; }

        .whatsapp-float {
            position: fixed; bottom: 20px; left: 20px; background: #25d366; color: #fff;
            width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 1.4rem; box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
            z-index: 988; text-decoration: none;
        }

        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); align-items: center; justify-content: center;
        }
        .modal-box {
            background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--border);
            max-width: 420px; width: 92%; box-shadow: 0 20px 40px rgba(0,0,0,0.8); max-height: 90vh; overflow-y: auto;
        }
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; text-align: right; }
        label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
        input, textarea, select {
            padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
            background: var(--bg); color: var(--text-main); outline: none; width: 100%; font-size: 0.85rem;
        }
        .btn-main { background: #fff; color: #000; margin-top: 5px; border: none; padding: 11px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-cancel { background: rgba(255, 71, 87, 0.1); color: var(--danger); margin-top: 6px; border: 1px solid rgba(255, 71, 87, 0.2); padding: 9px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px; grid-column: 1 / -1; font-size: 0.85rem; }

        .loading-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000;
            justify-content: center; align-items: center; color: #fff; flex-direction: column; gap: 15px; font-weight: bold;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div id="loadingText">چاوەڕوان بە...</div>
    </div>

    <header>
        <div class="container">
            <div class="header-content">
                <div class="header-main-row">
                    <!-- لۆگۆ و ناوی Zhiar Watch پێکەوە لە یەک ڕیزدا -->
                    <a href="#" class="brand-logo" onclick="filterCategory('All', document.querySelector('.sidebar-item')); return false;">
                        <div class="logo-icon-box">
                            <img src="logo.png" alt="Logo">
                        </div>
                        <span class="brand-title">Zhiar Watch</span>
                    </a>

                    <div class="header-search-wrapper">
                        <span class="header-search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="searchInput" class="header-search-input" placeholder="گەڕان بەدوای کاتژمێردا..." oninput="handleSearchAndFilter()">
                    </div>

                    <div class="header-actions">
                        <button class="icon-btn" id="wishlistHeaderBtn" onclick="toggleWishlistFilter()" title="دڵخوازەکان">
                            <i class="fa-solid fa-heart"></i>
                            <span class="badge-count" id="wishlistCount">0</span>
                        </button>
                        <button class="icon-btn" onclick="openCartModal()" title="سەبەتەی کڕین">
                            <i class="fa-solid fa-bag-shopping"></i>
                            <span class="badge-count" id="cartCount">0</span>
                        </button>
                        <button class="menu-btn" onclick="toggleSidebar()" title="مۆنیو">
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title"><i class="fa-solid fa-sliders"></i> پۆلێن و مۆدێلەکان</div>
            <button class="close-sidebar" onclick="toggleSidebar()">×</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px;">
            <button class="sidebar-item active" onclick="filterCategory('All', this)"><i class="fa-solid fa-border-all"></i> هەموو کاتژمێرەکان</button>
            <button class="sidebar-item" onclick="filterCategory('Piawan', this)"><i class="fa-solid fa-mars"></i> پیاوانە</button>
            <button class="sidebar-item" onclick="filterCategory('Xanman', this)"><i class="fa-solid fa-venus"></i> خانمانە</button>
            <button class="sidebar-item" onclick="filterCategory('Classic', this)"><i class="fa-solid fa-clock"></i> کلاسیک</button>
            <button class="sidebar-item" onclick="filterCategory('Automatic', this)"><i class="fa-solid fa-gears"></i> ئۆتۆماتیک</button>
            <button class="sidebar-item" onclick="filterCategory('Sport', this)"><i class="fa-solid fa-person-running"></i> وەرزشی</button>
            
            <div style="border-top: 1px solid var(--border); margin: 6px 0; padding-top: 6px; color: var(--text-muted); font-size: 0.75rem; font-weight: bold;">تۆڕە کۆمەڵایەتییەکان:</div>
            <a href="https://www.instagram.com/zhiarwatch?igsi=dWUxOG9uNzFxc3Bo" target="_blank" class="sidebar-item"><i class="fa-brands fa-instagram" style="color: #e1306c;"></i> ئینستاگرام</a>
            <a href="https://www.facebook.com/share/1Eoid7Le5b/?mibextid=wwXIfr" target="_blank" class="sidebar-item"><i class="fa-brands fa-facebook" style="color: #1877f2;"></i> فەیسبووک</a>
            <a href="https://tiktok.com/@markashop1?_t=ZS-8xnwz9n5B3Q&_r=1" target="_blank" class="sidebar-item"><i class="fa-brands fa-tiktok" style="color: #ff0050;"></i> تیک تۆک</a>
            <a href="https://wa.me/9647732649868" target="_blank" class="sidebar-item"><i class="fa-brands fa-whatsapp" style="color: #25d366;"></i> واتسئەپ</a>
            <a href="https://snapchat.com/@markashop1?invite_id=KECM_kPd&locale=en_IQ&share_id=re2HaouKSEiCg2ZwZZVSbg&sid=1e2f77cbc9b546e9adb867434d7f41de" target="_blank" class="sidebar-item"><i class="fa-brands fa-snapchat" style="color: #fffc00;"></i> سناپچات</a>
        </div>
    </div>

    <div class="container">
        <div class="controls">
            <select id="priceFilter" class="filter-box" onchange="handleSearchAndFilter()">
                <option value="default">ڕیزکردن بەپێی نرخ</option>
                <option value="low-high">نرخ: لە هەرزانەوە بۆ گران</option>
                <option value="high-low">نرخ: لە گرانەوە بۆ هەرزان</option>
            </select>
        </div>

        <div class="products-grid" id="productsGrid">
            <div class="empty-state">چاوەڕوانی بارکردنی کاتژمێرەکان... ⏳</div>
        </div>
    </div>

    <a href="https://wa.me/9647732649868" target="_blank" class="whatsapp-float" title="پەیوەندی واتسئەپ"><i class="fa-brands fa-whatsapp"></i></a>

    <div id="productDetailModal" class="modal">
        <div class="modal-box" id="productDetailContent"></div>
    </div>

    <div id="cartModal" class="modal">
        <div class="modal-box">
            <h3 style="margin-bottom: 12px; font-weight: bold; font-size: 1rem;"><i class="fa-solid fa-cart-shopping"></i> سەبەتەی کڕین و داواکاری ڕاستەوخۆ</h3>
            <div id="cartItemsList" style="margin-bottom: 12px; max-height: 150px; overflow-y: auto;"></div>
            
            <form id="orderForm" onsubmit="submitOrder(event)">
                <div class="form-group">
                    <label>ژمارەی تەلەفۆن</label>
                    <input type="tel" id="custPhone" placeholder="0770..." pattern="[0-9]*" inputmode="numeric" required>
                </div>
                <div class="form-group">
                    <label>ناونیشانی تەواو (شار / کۆڵان / خانوو)</label>
                    <input type="text" id="custAddress" placeholder="بۆ نموونە: سلێمانی، تووی مەلیک..." required>
                </div>
                <div class="form-group">
                    <label>شێوازی پارەدان</label>
                    <select id="paymentMethod" onchange="handlePaymentChange()" required>
                        <option value="Cash">پارەدانی کاش لە کاتی وەرگرتن</option>
                        <option value="QI Card">کی کارد (QI Card) - 07732649868</option>
                        <option value="FIB">فێربانک (FIB) - 07732649868</option>
                    </select>
                </div>
                
                <div id="paymentNotice" style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 10px; display: none; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px; border: 1px solid var(--border);">
                    📌 تکایە پارەکە بگوازەوە بۆ ئەم ژمارەیە: <b style="color:#fff;">07732649868</b> 
                    <button type="button" onclick="copyPhoneNum()" style="background: #fff; color: #000; border: none; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; cursor: pointer; margin-right: 4px;">کۆپی</button>
                </div>

                <div class="form-group">
                    <label>ناوی ئەو کەسەی پارەی ناردووە / یان کۆدی پسوولە</label>
                    <input type="text" id="paymentRef" placeholder="ناوی تەواو یان ژمارەی پسوولە...">
                </div>

                <div class="form-group">
                    <label>تێبینی داواکاری</label>
                    <textarea id="custNote" placeholder="تێبینی..." rows="2"></textarea>
                </div>
                <button type="submit" class="btn-main">ناردنی داواکاری بە سەرکەوتوویی</button>
            </form>
            <button class="btn-cancel" onclick="closeCartModal()">داخستن</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCTr8X3UcOPkGo4aI40apTIc9NQ8kpyXrw",
        authDomain: "zhiar-watch.firebaseapp.com",
        projectId: "zhiar-watch",
        storageBucket: "zhiar-watch.firebasestorage.app",
        messagingSenderId: "795784319956",
        appId: "1:795784319956:web:c18103424f64a7fdafbc41",
        measurementId: "G-ELG7VW6CNT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allProducts = [];
    let currentCategory = 'All';
    let viewingWishlist = false;
    window.cart = [];
    window.productReviews = JSON.parse(localStorage.getItem('zhiar_reviews')) || {};
    window.wishlist = JSON.parse(localStorage.getItem('zhiar_wishlist')) || [];

    function updateWishlistCounter() {
        document.getElementById('wishlistCount').innerText = window.wishlist.length;
    }
    updateWishlistCounter();

    window.copyPhoneNum = function() {
        navigator.clipboard.writeText("07732649868");
        alert("ژمارە کۆپی کرا!");
    }

    const q = query(collection(db, "website_products"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
        allProducts = [];
        snapshot.forEach((docSnap) => {
            allProducts.push({ id: docSnap.id, ...docSnap.data() });
        });
        handleSearchAndFilter();
    });

    window.toggleSidebar = function() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    window.handleSearchAndFilter = function() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const priceSort = document.getElementById('priceFilter').value;
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';

        let filtered = currentCategory === 'All' ? [...allProducts] : allProducts.filter(p => p.category === currentCategory);

        if (viewingWishlist) {
            filtered = filtered.filter(p => window.wishlist.includes(p.id));
        }

        if(searchText.trim() !== '') {
            filtered = filtered.filter(p => 
                (p.title && p.title.toLowerCase().includes(searchText)) || 
                (p.color && p.color.toLowerCase().includes(searchText)) ||
                (p.note && p.note.toLowerCase().includes(searchText))
            );
        }

        if(priceSort === 'low-high') {
            filtered.sort((a, b) => Number(a.price) - Number(b.price));
        } else if(priceSort === 'high-low') {
            filtered.sort((a, b) => Number(b.price) - Number(a.price));
        }

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state">هیچ کاتژمێرێک نەدۆزراوەوە! 📭</div>`;
            return;
        }

        filtered.forEach((p) => {
            let images = p.images || (p.image ? [p.image] : []);
            let mainImg = images.length > 0 ? images[0] : '';
            let isLiked = window.wishlist.includes(p.id);

            grid.innerHTML += `
                <div class="product-card" onclick="openProductDetail('${p.id}')">
                    <div class="badge">بەردەستە ⚡</div>
                    <button class="wishlist-btn ${isLiked ? 'liked' : ''}" onclick="event.stopPropagation(); toggleWishlist('${p.id}')" title="دڵخواز">
                        ${isLiked ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>'}
                    </button>
                    <div class="product-img"><img src="${mainImg}" alt="${p.title}"></div>
                    <div class="product-info">
                        <div class="product-name">${p.title}</div>
                        <div class="product-price">${Number(p.price).toLocaleString()} ${p.currency || 'د.ع'}</div>
                        <div class="product-meta"><span>ڕەنگ: ${p.color}</span><span style="color:#fff; font-weight:600;">${p.category}</span></div>
                        <button class="btn-add" onclick="event.stopPropagation(); addToCartFromGrid('${p.id}')">زیادکردن بۆ سەبەتە</button>
                    </div>
                </div>
            `;
        });
    }

    window.toggleWishlist = function(productId) {
        const index = window.wishlist.indexOf(productId);
        if(index > -1) {
            window.wishlist.splice(index, 1);
        } else {
            window.wishlist.push(productId);
        }
        localStorage.setItem('zhiar_wishlist', JSON.stringify(window.wishlist));
        updateWishlistCounter();
        handleSearchAndFilter();
    }

    window.toggleWishlistFilter = function() {
        viewingWishlist = !viewingWishlist;
        const btn = document.getElementById('wishlistHeaderBtn');
        if(viewingWishlist) {
            btn.style.color = 'var(--danger)';
        } else {
            btn.style.color = 'var(--text-main)';
        }
        handleSearchAndFilter();
    }

    window.filterCategory = function(category, btnElement) {
        currentCategory = category;
        viewingWishlist = false;
        document.getElementById('wishlistHeaderBtn').style.color = 'var(--text-main)';

        document.querySelectorAll('.sidebar-item').forEach(b => {
            if(!b.href) b.classList.remove('active');
        });
        if(btnElement && !btnElement.href) {
            btnElement.classList.add('active');
        }
        handleSearchAndFilter();
        const sidebar = document.getElementById('sidebar');
        if(sidebar.classList.contains('active')) {
            toggleSidebar();
        }
    }

    window.openProductDetail = function(productId) {
        const p = allProducts.find(item => item.id === productId);
        if(!p) return;

        let images = p.images || (p.image ? [p.image] : []);
        let imagesHtml = images.map(img => `<img src="${img}" style="width:100%; height:170px; object-fit:cover; border-radius:10px; margin-bottom:6px;" />`).join('');

        let reviews = window.productReviews[productId] || [];
        let reviewsHtml = reviews.length > 0 ? reviews.map(r => `
            <div style="background: rgba(255,255,255,0.02); padding: 6px; border-radius: 6px; margin-bottom: 4px; font-size: 0.75rem;">
                <div style="font-weight: bold; color: #fff;">⭐ ${r.rating}/5 - ${r.name}</div>
                <div style="color: var(--text-muted);">${r.comment}</div>
            </div>
        `).join('') : '<div style="font-size: 0.7rem; color: var(--text-muted);">هێشتا هیچ ڕایەک نییە.</div>';

        let content = document.getElementById('productDetailContent');
        content.innerHTML = `
            <h3 style="margin-bottom: 8px; font-size: 1rem; color: #fff;">${p.title}</h3>
            <div style="max-height: 170px; overflow-y: auto; margin-bottom: 8px;">${imagesHtml}</div>
            <div style="display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; margin-bottom: 10px; color: var(--text-muted);">
                <div>نرخ: <span style="color:#fff; font-weight:bold;">${Number(p.price).toLocaleString()} ${p.currency || 'د.ع'}</span></div>
                <div>پۆلێن: <span style="color:#fff; font-weight:bold;">${p.category}</span></div>
                <div>ڕەنگ: <span style="color:#fff; font-weight:bold;">${p.color}</span></div>
                <div>تێبینی: <span style="color:#fff;">${p.note || 'نییە'}</span></div>
            </div>

            <div class="form-group">
                <label>دانە / بڕ</label>
                <input type="number" id="detailQty" value="1" min="1" style="text-align: center; font-weight: bold;">
            </div>
            <button class="btn-main" onclick="addDetailedToCart('${p.id}')">زیادکردن بۆ سەبەتە</button>
            
            <div style="border-top: 1px solid var(--border); margin-top: 12px; padding-top: 8px;">
                <h4 style="font-size: 0.8rem; margin-bottom: 6px; color: #fff;"><i class="fa-solid fa-comments"></i> ڕای کڕیاران</h4>
                <div style="max-height: 100px; overflow-y: auto; margin-bottom: 8px;">${reviewsHtml}</div>
                
                <div style="background: rgba(255,255,255,0.02); padding: 6px; border-radius: 8px; border: 1px solid var(--border);">
                    <div style="font-size: 0.7rem; font-weight: bold; margin-bottom: 4px; color: #fff;">ڕای خۆت بنووسە:</div>
                    <input type="text" id="reviewName" placeholder="ناوی تۆ..." style="margin-bottom: 4px; font-size: 0.75rem;">
                    <select id="reviewRating" style="margin-bottom: 4px; font-size: 0.75rem;">
                        <option value="5">⭐⭐⭐⭐⭐ (نایاب)</option>
                        <option value="4">⭐⭐⭐⭐ (باش)</option>
                        <option value="3">⭐⭐⭐ (ناوەند)</option>
                    </select>
                    <textarea id="reviewComment" placeholder="تێبینی..." rows="2" style="margin-bottom: 4px; font-size: 0.75rem;"></textarea>
                    <button type="button" class="btn-main" onclick="submitReview('${p.id}')" style="padding: 6px; font-size: 0.75rem;">ناردنی ڕای خۆت</button>
                </div>
            </div>
            <button class="btn-cancel" onclick="closeProductDetail()" style="margin-top: 10px;">داخستن</button>
        `;
        document.getElementById('productDetailModal').style.display = 'flex';
    }

    window.closeProductDetail = function() {
        document.getElementById('productDetailModal').style.display = 'none';
    }

    window.submitReview = function(productId) {
        const name = document.getElementById('reviewName').value.trim();
        const rating = document.getElementById('reviewRating').value;
        const comment = document.getElementById('reviewComment').value.trim();

        if(!name || !comment) { alert("تکایە ناو و تێبینی پڕبکەرەوە!"); return; }

        if(!window.productReviews[productId]) window.productReviews[productId] = [];
        window.productReviews[productId].push({ name, rating, comment });
        localStorage.setItem('zhiar_reviews', JSON.stringify(window.productReviews));
        
        alert("سوپاس، سەرنجەکەت زیادکرا!");
        openProductDetail(productId);
    }

    window.addDetailedToCart = function(productId) {
        const p = allProducts.find(item => item.id === productId);
        if(!p) return;
        let qty = parseInt(document.getElementById('detailQty').value) || 1;
        for(let i=0; i<qty; i++) window.cart.push(p);
        document.getElementById('cartCount').innerText = window.cart.length;
        alert("بەرهەمەکە زیادکرا بۆ سەبەتە!");
        closeProductDetail();
    }

    window.addToCartFromGrid = function(productId) {
        const p = allProducts.find(item => item.id === productId);
        if(p) {
            window.cart.push(p);
            document.getElementById('cartCount').innerText = window.cart.length;
            alert("کاتژمێرەکە زیادکرا بۆ سەبەتە!");
        }
    }

    window.removeFromCart = function(index) {
        window.cart.splice(index, 1);
        document.getElementById('cartCount').innerText = window.cart.length;
        openCartModal();
    }

    window.openCartModal = function() {
        if(window.cart.length === 0) { alert("سەبەتەی کڕین بەتالە!"); closeCartModal(); return; }
        let listDiv = document.getElementById('cartItemsList');
        listDiv.innerHTML = '';
        let total = 0;
        
        window.cart.forEach((item, index) => {
            total += Number(item.price);
            listDiv.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); font-size:0.8rem;">
                    <span style="font-weight:600; color:#fff;">${item.title}</span>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <span style="color:#fff; font-weight:bold;">${Number(item.price).toLocaleString()} ${item.currency || 'د.ع'}</span>
                        <button onclick="removeFromCart(${index})" style="background:rgba(255,71,87,0.1); color:var(--danger); border:1px solid rgba(255,71,87,0.3); padding:2px 6px; border-radius:4px; cursor:pointer; font-size:0.7rem; font-weight:bold;">سڕینەوە</button>
                    </div>
                </div>`;
        });
        
        listDiv.innerHTML += `<div style="font-weight:bold; margin-top:8px; text-align:left; font-size:0.85rem; color:#fff;">کۆی گشتی: ${total.toLocaleString()} د.ع</div>`;
        document.getElementById('cartModal').style.display = 'flex';
    }

    window.closeCartModal = function() { document.getElementById('cartModal').style.display = 'none'; }

    window.handlePaymentChange = function() {
        const method = document.getElementById('paymentMethod').value;
        document.getElementById('paymentNotice').style.display = (method === 'QI Card' || method === 'FIB') ? 'block' : 'none';
    }

    window.submitOrder = async function(e) {
        e.preventDefault();
        const phone = document.getElementById('custPhone').value;
        const address = document.getElementById('custAddress').value;
        const paymentMethod = document.getElementById('paymentMethod').value;
        const paymentRef = document.getElementById('paymentRef').value; 
        const note = document.getElementById('custNote').value;

        document.getElementById('loadingOverlay').style.display = 'flex';
        document.getElementById('loadingText').innerText = "خەریکی ناردنی داواکارییەکەیە...";

        try {
            for(let item of window.cart) {
                await addDoc(collection(db, "marka_orders"), {
                    date: new Date().toISOString(),
                    customerPhone: phone,
                    customerAddress: address,
                    paymentMethod: paymentMethod,
                    paymentRef: paymentRef || 'نییە / کاش', 
                    watchPrice: item.price,
                    quantity: 1,
                    currency: item.currency || 'د.ع',
                    watchColor: item.color,
                    note: note,
                    pageName: item.pageName || 'zhiar watch',
                    images: item.images || [item.image],
                    isSent: false,
                    createdAt: Date.now()
                });
            }

            alert("داواکارییەکەت و زانیاری پارەدان بە سەرکەوتوویی نێردرا بۆ بەڕێوەبردن!");
            window.cart = [];
            document.getElementById('cartCount').innerText = 0;
            closeCartModal();
            document.getElementById('orderForm').reset();
            document.getElementById('paymentNotice').style.display = 'none';
        } catch(err) {
            console.error("Error: ", err);
            alert("کێشەیەک ڕوویدا: " + err.message);
        } finally {
            document.getElementById('loadingOverlay').style.display = 'none';
        }
    }
</script>
</body>
</html>
